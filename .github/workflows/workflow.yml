name: Update Library
on:
  issues:
    types: [opened]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grant write permissions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install json

      - name: Run Python script
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python update_library.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/library.json data/library.csv
          git commit -m "Update library data"
          git push origin HEAD:${{ github.ref }}
      - name: Close issue
        if: success() && github.event.issue.state == 'open'
        uses: peter-evans/close-issue@v2  
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Library updated successfully and issue closed."
          reason: completed 
      - name: Handle failure
        if: failure() 
        uses: actions/github-script@v6
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const comment = "There was an error updating the library. Please check the logs for details.";
            await github.issues.createComment({
              ...context.repo,
              issue_number,
              body: comment
            });
            await github.issues.update({
              ...context.repo,
              issue_number,
              state: 'open'
            });
            