<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Library Management System</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by Title, Author, or User">
                <button onclick="searchBooks()">Search</button>
            </div>
        </div>
    </header>
    <main>
        <section id="checkout">
            <h2>Check Out a Book</h2>
            <input type="text" id="checkoutName" placeholder="Your Name">
            <input type="text" id="checkoutBarcode" placeholder="Book Barcode">
            <button onclick="checkoutBook()">Check Out</button>
        </section>
        <section id="checkin">
            <h2>Check In a Book</h2>
            <input type="text" id="checkinBarcode" placeholder="Book Barcode">
            <button onclick="checkinBook()">Check In</button>
        </section>
        <section id="bookList">
            <h2>Library Books</h2>
            <div id="booksContainer" class="books-container"></div>
            <div id="pagination">
                <button id="prevPage" onclick="changePage(-1)">Previous</button>
                <span id="currentPage">Page 1</span>
                <button id="nextPage" onclick="changePage(1)">Next</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
